# Smart Home Panel – example configuration
# Copy to config.yaml and adjust.
# ${VARIABLE} is replaced with environment variables (e.g. from /etc/smarthome-panel.env).

# The Homebridge connection (address, port, PIN), appearance and screen saver are set
# in the app under "Settings" (~/.config/smarthome-panel/settings.json).
# This file contains rooms, icons, scenes and schedules.

server:
  poll_interval: 5       # seconds between two device polls
  timezone: Europe/Berlin

panel:
  title: Our Home
  default_room: General
  show_cooling: false    # show the "Cool" mode on thermostats (e.g. air conditioning)

# --- Additional Homebridge bridges (optional) --------------------------------------
# The main bridge ("homebridge") is set in the app. Child bridges have their own
# ports and PINs and can be added here as well:
hap: []
#  - name: hue-bridge
#    host: 127.0.0.1
#    port: 53412
#    pin: "123-45-678"

# --- Alternative: via the Homebridge web UI (homebridge-config-ui-x) ---------------
# Also requires insecure mode. Without username, /api/auth/noauth is used.
homebridge_ui: []
#  - name: homebridge-ui
#    url: http://127.0.0.1:8581
#    username: admin
#    password: ${HOMEBRIDGE_PASSWORD}

# --- Demo devices for trying the panel without Homebridge --------------------------
demo:
  enabled: false

# --- Customize devices: key = device ID (see Settings → Info) or original name ------
devices:
  # Icons (icon): light, ceiling, strip, plug, switch, thermostat, radiator, floor, fan, coffee, tv,
  #               weather, drop, sun
  # Sensors: outdoor: true shows the temperature as "outdoors" instead of indoors
  "Living Room Ceiling Light": { room: Living Room, order: 1, icon: ceiling }
  "LED Strip":                 { room: Living Room, name: TV Light, icon: strip }
  "Living Room Heating":       { room: Living Room, icon: radiator }
  "Kitchen Light":             { room: Kitchen }
  "Coffee Maker":              { room: Kitchen, icon: coffee }
  "Bathroom Heating":          { room: Bathroom, icon: floor }
  "TV Plug":                   { room: Living Room, icon: tv }
  "Weather Station":           { room: Garden, outdoor: true }
  "Living Room Climate":       { room: Living Room }
  "Hall Light Sensor":         { room: Hall }
  # "homebridge:12.10":        { hidden: true }

# --- Scenes (icon: moon, sun, film, leaf, home, power) -----------------------------
# Attributes: on, brightness (0–100), hue (0–360), saturation (0–100),
#             color_temp (mired 140–500), speed (0–100),
#             target_temp (°C), mode (off | heat | cool | auto)
scenes:
  - id: all-off
    name: All off
    icon: moon
    actions:
      - { device: Living Room Ceiling Light, set: { on: false } }
      - { device: LED Strip,                 set: { on: false } }
      - { device: Kitchen Light,             set: { on: false } }
      - { device: Coffee Maker,              set: { on: false } }
  - id: movie
    name: Movie night
    icon: film
    actions:
      - { device: Living Room Ceiling Light, set: { on: true, brightness: 20 } }
      - { device: LED Strip,                 set: { on: true, brightness: 60, hue: 260, saturation: 80 } }
      - { device: TV Plug,                   set: { on: true } }
  - id: heating-comfort
    name: Comfort
    icon: sun
    actions:
      - { device: Living Room Heating, set: { mode: heat, target_temp: 21.5 } }
      - { device: Bathroom Heating,    set: { mode: heat, target_temp: 22.5 } }
  - id: heating-eco
    name: Eco
    icon: leaf
    actions:
      - { device: Living Room Heating, set: { mode: heat, target_temp: 18 } }
      - { device: Bathroom Heating,    set: { mode: heat, target_temp: 18 } }

# --- Schedules: run a scene at a time of day on selected weekdays ------------------
# Weekdays: mo tu we th fr sa su (default: every day)
schedules:
  - { time: "06:30", days: [mo, tu, we, th, fr], scene: heating-comfort }
  - { time: "08:00", days: [sa, su],             scene: heating-comfort }
  - { time: "22:30",                             scene: heating-eco }
