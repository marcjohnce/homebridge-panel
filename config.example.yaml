# Smart Home Panel – example configuration
# Copy to config.yaml and adjust.
# ${VARIABLE} is replaced with environment variables (e.g. from /etc/smarthome-panel.env).

# The Homebridge connection (address, port, PIN), appearance and screen saver are set
# in the app under "Settings" (~/.config/smarthome-panel/settings.json).
# This file contains rooms, names and icons of devices. Scenes are made on the panel.

server:
  poll_interval: 5       # seconds between two device polls
  timezone: Europe/Berlin

panel:
  title: Our Home
  default_room: General
  show_cooling: false    # show the "Cool" mode on thermostats (e.g. air conditioning)

# --- Additional Homebridge bridges (optional) --------------------------------------
# The main bridge ("homebridge") is set in the app. Child bridges have their own
# ports and PINs and can be added here as well:
hap: []
#  - name: hue-bridge
#    host: 127.0.0.1
#    port: 53412
#    pin: "123-45-678"

# --- Alternative: via the Homebridge web UI (homebridge-config-ui-x) ---------------
# Also requires insecure mode. Without username, /api/auth/noauth is used.
homebridge_ui: []
#  - name: homebridge-ui
#    url: http://127.0.0.1:8581
#    username: admin
#    password: ${HOMEBRIDGE_PASSWORD}

# --- Demo devices for trying the panel without Homebridge --------------------------
demo:
  enabled: false

# --- Customize devices: key = device ID (see Settings → Info) or original name ------
devices:
  # Icons (icon): light, ceiling, strip, plug, switch, thermostat, radiator, floor, fan, coffee, tv,
  #               weather, drop, sun
  # Sensors: outdoor: true shows the temperature as "outdoors" instead of indoors
  # Contact/motion sensors: security: window | door | contact | glassbreak | motion (also selectable on the panel)
  # Switches/plugs: appliance: switch | plug | coffee | washer | dishwasher | fan (fan: shown under Climate)
  # Lights: lamp: bulb | ceiling | pendant | chandelier | spot | downlight | wall | table | desk | floorlamp | globe | tube | strip (icon)
  # Any device: area: light | climate | security moves it to another menu entry
  "Living Room Ceiling Light": { room: Living Room, order: 1, icon: ceiling }
  "LED Strip":                 { room: Living Room, name: TV Light, icon: strip }
  "Living Room Heating":       { room: Living Room, icon: radiator }
  "Kitchen Light":             { room: Kitchen }
  "Coffee Maker":              { room: Kitchen, appliance: coffee }
  "Bathroom Heating":          { room: Bathroom, icon: floor }
  "TV Plug":                   { room: Living Room }
  "Washing Machine":           { room: Bathroom, appliance: washer }
  "Weather Station":           { room: Garden, outdoor: true }
  "Living Room Climate":       { room: Living Room }
  "Hall Light Sensor":         { room: Hall }
  "Air Quality":               { room: Living Room }
  "Living Room Blinds":        { room: Living Room }
  "Bedroom Blinds":            { room: Bedroom }
  "Terrace Door":              { room: Living Room, security: door }
  "Terrace Glass Break":       { room: Living Room, security: glassbreak }
  "Bedroom Window":            { room: Bedroom, security: window }
  "Washing Machine Leak":      { room: Bathroom }
  "Hall Smoke Detector":       { room: Hall }
  "Alarm System":              { room: Hall }
  "Garden Sprinkler":          { room: Garden }
  "Garage Door":               { room: Garage }
  "Front Door Lock":           { room: Hall }
  "Living Room TV":            { room: Living Room }
  "Skylight":                  { room: Bedroom }
  "Kitchen Speaker":           { room: Kitchen }
  "Bedroom Air Purifier":      { room: Bedroom }
  "Bedroom Humidifier":        { room: Bedroom }
  # "homebridge:12.10":        { hidden: true }

# --- Ignore devices completely -----------------------------------------------------
# Every device whose original name (as in Homebridge) contains one of these texts is
# left out entirely: no tile, not in the settings, no alarms, not usable in scenes.
# Upper/lower case doesn't matter.
blacklist:
#  - "Test"              # e.g. "Test Switch", "Dummy Test Light"
#  - "Bridge Status"
